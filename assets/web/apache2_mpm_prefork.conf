# Local development override for Apache prefork MPM.
#
# The default image keeps only 10 spare processes and spawns additional ones
# just once per second. Moodle does a lot of single connections, so we
# increase this to optimize performance.
<IfModule mpm_prefork_module>
    StartServers            40
    MinSpareServers         40
    MaxSpareServers         80
    MaxRequestWorkers       150
</IfModule>

