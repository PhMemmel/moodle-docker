services:
  webserver:
    image: "moodlehq/moodle-php-apache:${MOODLE_DOCKER_PHP_VERSION}"
    depends_on:
      - db
    volumes:
      - "${MOODLE_DOCKER_WWWROOT}:/var/www/html"
      - "${ASSETDIR}/web/apache2_faildumps.conf:/etc/apache2/conf-enabled/moodle-faildump.conf"
    environment:
      MOODLE_DOCKER_RUNNING: 1
      MOODLE_DOCKER_DBNAME: moodle
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBPASS: "m@0dl3ing"
      MOODLE_DOCKER_BROWSER: firefox
      MOODLE_DOCKER_WEB_HOST: "${MOODLE_DOCKER_WEB_HOST}"
      MOODLE_DOCKER_TIMEOUT_FACTOR: "${MOODLE_DOCKER_TIMEOUT_FACTOR}"
  exttests:
    image: moodlehq/moodle-exttests
    volumes:
      - "${ASSETDIR}/exttests/apache2_ports.conf:/etc/apache2/ports.conf"
      - "${ASSETDIR}/exttests/apache2.conf:/etc/apache2/sites-enabled/000-default.conf"
  selenium:
    image: "selenium/standalone-firefox${MOODLE_DOCKER_SELENIUM_SUFFIX:-}:${MOODLE_DOCKER_BROWSER_TAG}"
    volumes:
      - "${MOODLE_DOCKER_WWWROOT}:/var/www/html"
  dbphpunitpostgres:
    image: postgres:17
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: "m@0dl3ing"
      POSTGRES_DB: moodle
  # Qdrant vector database — used to develop/test the aivecstore_qdrant backend.
  # Reachable from the webserver container at http://qdrant:6333 (and from the host at :6333).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
  # PostgreSQL + pgvector — used to develop/test the aivecstore_postgres backend.
  # Reachable from the webserver at pgvector:5432 (host :5433). Separate from the Moodle db.
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vectors
      POSTGRES_USER: vectors
      POSTGRES_PASSWORD: vectors
    ports:
      - "5433:5432"

